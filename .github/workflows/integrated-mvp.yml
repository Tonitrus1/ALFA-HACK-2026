name: Integrated backend and ML MVP
on:
  push:
    branches: ['integration/backend-ml-mvp']
  pull_request:
    paths: ['backend/**', 'ml/**', 'deploy/**', 'compose.yaml', 'scripts/integration/**', '.github/workflows/integrated-mvp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./backend/mvnw -B -ntp -f backend/pom.xml verify
        env: {LC_ALL: C, LANG: C}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict --target ES2022 --lib ES2022,DOM frontend/integration/api.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-results, path: 'backend/**/target/surefire-reports/TEST-*.xml'}
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install jsonschema==4.25.1
      - run: python3 scripts/integration/configure.py
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Prepare pinned E5 on the target Linux CPU environment
        run: |
          mkdir -p .local/feed-bundle
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -v "$PWD/.local/feed-bundle:/bundle" --entrypoint python credit-mvp-feed:local -m feed.prepare --bundle /bundle --download
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Real public HTTP flow
        run: python3 scripts/integration/smoke.py --output reports/integration-linux/smoke.json
      - name: Restart preserves state and accepted responses
        run: |
          docker compose restart backend ml-bridge risk
          python3 scripts/integration/smoke.py --replay --output reports/integration-linux/restart.json
      - name: Feed outage uses rules
        run: |
          docker compose stop feed
          python3 scripts/integration/smoke.py --expect-feed RULES --output reports/integration-linux/feed-outage.json
          docker compose start feed
      - name: Risk outage routes eligible application to manual review
        run: |
          docker compose stop risk
          python3 scripts/integration/smoke.py --risk-outage --output reports/integration-linux/risk-outage.json
      - name: Runtime network is isolated
        run: |
          docker compose exec -T ml-bridge python -c "import socket; s=socket.socket(); s.settimeout(2); result=s.connect_ex(('1.1.1.1',443)); s.close(); assert result != 0, 'External TCP unexpectedly allowed'"
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p reports/integration-linux
          docker compose logs --no-color > reports/integration-linux/compose.log
          docker compose images --format json > reports/integration-linux/images.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integrated-linux-evidence, path: reports/integration-linux}
      - run: docker compose down
        if: always()
