name: Integrated backend and ML MVP
on:
  push:
    branches: ['integration/**']
    paths: ['backend/**', 'ml/**', 'frontend/**', 'deploy/**', 'compose.yaml', 'scripts/integration/**', '.github/workflows/integrated-mvp.yml']
  pull_request:
    paths: ['backend/**', 'ml/**', 'frontend/**', 'deploy/**', 'compose.yaml', 'scripts/integration/**', '.github/workflows/integrated-mvp.yml']
  workflow_dispatch:
concurrency:
  group: integrated-mvp-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./backend/mvnw -B -ntp -f backend/pom.xml verify
        env: {LC_ALL: C, LANG: C}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-results, path: 'backend/**/target/surefire-reports/TEST-*.xml'}
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 -m pip install jsonschema==4.25.1
      - run: python3 scripts/integration/configure.py
      - run: docker compose config --quiet
      - run: docker compose build
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Baseline, new releases, browser, failure, persistence and rollback acceptance
        run: bash scripts/integration/linux_acceptance.sh
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p reports/integration-linux
          docker compose logs --no-color > reports/integration-linux/compose.log
          docker compose images --format json > reports/integration-linux/images.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-linux-evidence
          path: |
            reports/integration-linux
            reports/ui-feed-antifraud/browser.json
            .local/browser-results
      - run: docker compose down
        if: always()
