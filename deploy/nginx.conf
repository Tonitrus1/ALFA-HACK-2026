events {}
http {
    include /etc/nginx/mime.types;
    access_log off;
    limit_req_zone $binary_remote_addr zone=password_login:10m rate=30r/m;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 10m;
        location = /healthz { return 200 "ok\n"; }
        location = /index.html { try_files $uri =404; add_header Cache-Control no-store; }
        location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
        add_header X-Content-Type-Options nosniff always;
        location = /api/v1/auth/login {
            limit_req zone=password_login burst=20 nodelay;
            limit_req_status 429;
            error_page 429 = @login_rate_limited;
            set $backend_url http://backend:8080;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location @login_rate_limited {
            default_type application/json;
            add_header Retry-After 2 always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"code":"AUTH_RATE_LIMITED","message":"Слишком частые запросы. Повторите вход через пару секунд.","correlationId":"$request_id"}';
        }
        location ~ ^/(api/|demo/api/|assets/feed/) {
            set $backend_url http://backend:8080;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 190s;
            proxy_buffering off;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
    }
}
