events {}
http {
    include /etc/nginx/mime.types;
    access_log off;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 10m;
        location = /healthz { return 200 "ok\n"; }
        location = /index.html { try_files $uri =404; add_header Cache-Control no-store; }
        location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
        add_header X-Content-Type-Options nosniff always;
        location ~ ^/(api/|demo/api/|assets/feed/) {
            set $backend_url http://backend:8080;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 190s;
            proxy_buffering off;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
    }
}
