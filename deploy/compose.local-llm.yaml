# CPU-only Qwen on the same machine as the application; no host Ollama or API key.
services:
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: 10m
    volumes: [ollama-models:/root/.ollama]
    networks: [internal, outbound]
    cpus: 6
    mem_limit: 5g
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama-init:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_RAG_MODEL: ${LOCAL_RAG_MODEL:-qwen2.5:3b}
      LOCAL_OCR_MODEL: ${LOCAL_OCR_MODEL:-qwen2.5:3b}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'for model in "$$LOCAL_RAG_MODEL" "$$LOCAL_OCR_MODEL"; do ollama show "$$model" >/dev/null 2>&1 || ollama pull "$$model"; done'
    depends_on: {ollama: {condition: service_healthy}}
    networks: [internal]
  assistant-init:
    environment:
      TOKENIZER_MODEL: Qwen/Qwen2.5-3B-Instruct
      TOKENIZER_REVISION: aa8e72537993ba99e69dfaafa59ed015b17504d1
    volumes: [assistant-local-models:/app/model-cache]
  assistant:
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LOCAL_RAG_MODEL:-qwen2.5:3b}
      LLM_REASONING_OPTIONS: 'false'
      LLM_JSON_WITH_TOOLS: 'false'
      COMPACT_TOOL_SOURCES: 'true'
      LLM_MAX_TOKENS: '384'
      LLM_TIMEOUT_SECONDS: '120'
      TURN_DEADLINE_SECONDS: '180'
      CONTEXT_TOKENS: '3072'
      RAG_TOKENS: '768'
      TOKENIZER_MODEL: Qwen/Qwen2.5-3B-Instruct
      TOKENIZER_REVISION: aa8e72537993ba99e69dfaafa59ed015b17504d1
    volumes: [assistant-local-models:/app/model-cache]
    depends_on: {ollama-init: {condition: service_completed_successfully}}
  ocr:
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LOCAL_OCR_MODEL:-qwen2.5:3b}
      LLM_REASONING_OPTIONS: 'false'
      LLM_RESPONSE_FORMAT: json_object
      LLM_TIMEOUT_SECONDS: '300'
      LLM_MAX_TOKENS: '3072'
      MAX_CONTEXT_CHARS: '16000'
    depends_on: {ollama-init: {condition: service_completed_successfully}}
  backend:
    environment:
      CREDIT_ASSISTANT_READ_TIMEOUT: PT185S
volumes:
  ollama-models: {}
  assistant-local-models: {}
