# Native Ollama on the host (Windows/macOS/Linux); no external provider key.
services:
  assistant:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
      LLM_REASONING_OPTIONS: 'false'
  ocr:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
      LLM_REASONING_OPTIONS: 'false'
      LLM_MAX_TOKENS: ${LOCAL_OCR_MAX_TOKENS:-4096}
      MAX_CONTEXT_CHARS: ${LOCAL_OCR_MAX_CONTEXT_CHARS:-24000}
