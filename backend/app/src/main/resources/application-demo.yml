# Локальный demo-профиль с синтетическими данными. Не включать на внешних стендах.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed/demo

credit:
  demo:
    enabled: true
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://127.0.0.1:8080
      - http://localhost:8080
  session:
    # Локальный http без TLS; на стендах с HTTPS — true.
    cookie-secure: false
