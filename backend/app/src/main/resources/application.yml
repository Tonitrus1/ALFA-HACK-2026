spring:
  application:
    name: credit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${DB_USER:credit}
    # Пароль только из окружения (backend/.env или переменная DB_PASSWORD); в репозитории его нет.
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Миграции лежат по модулям-владельцам: db/migration/<module>/V<n>__*.sql.
    # Номера версий глобальные; порядок согласует backend-владелец.
    locations: classpath:db/migration

credit:
  adapters:
    profile: local-mvp
    automatic-provider-fallback: false
    bindings:
      sessions: JdbcSessionAdapter
      cache: BoundedLocalCacheAdapter
      events: PostgresOutboxTransportAdapter
      objects: VersionedFilesystemObjectAdapter
  session:
    ttl: PT8H
    cookie-secure: true
  demo:
    enabled: false
  scheduling:
    enabled: true
  outbox:
    poll-interval: PT1S
  cache:
    max-entries: 10000
  objects:
    # Постоянный том файлов (quarantine/clean). В контейнере задаётся OBJECTS_ROOT на volume.
    root: ${OBJECTS_ROOT:${user.home}/.local/share/credit-backend/objects}

management:
  endpoints:
    web:
      exposure:
        include: health
