name: alfa-assistant
services:
  assistant:
    image: alfa-assistant:0.1.0-dev
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/knowledge.sqlite3
      DATA_DIR: /app/data
      MODEL_DIR: /app/model-cache
      QDRANT_URL: http://qdrant:6333
      SEARXNG_URL: http://searxng:8080
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - assistant-data:/app/data
      - model-cache:/app/model-cache
      - ./prompts:/app/prompts:ro
    depends_on:
      - qdrant
      - searxng
    networks: [internal, outbound]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 6s
      start_period: 90s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.15.5@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    volumes: ["qdrant-data:/qdrant/storage"]
    networks: [internal]
  searxng:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    networks: [internal, outbound]
networks:
  internal:
    internal: true
  outbound: {}
volumes:
  assistant-data: {}
  model-cache: {}
  qdrant-data: {}
