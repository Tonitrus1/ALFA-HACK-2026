use_default_settings:
  engines:
    keep_only: [duckduckgo, bing]
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
search:
  formats: [html, json]
  default_lang: ru
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: bing
    engine: bing
    shortcut: bi
