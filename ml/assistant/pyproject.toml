[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "alfa-assistant"
version = "0.1.0"
description = "Development-only credit assistant with local RAG and confirmed web ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.120.0", "uvicorn==0.38.0", "pydantic==2.12.3",
  "pydantic-settings==2.11.0", "openai==2.6.1", "httpx==0.28.1",
  "qdrant-client==1.15.1", "rank-bm25==0.2.2", "SQLAlchemy==2.0.44",
  "alembic==1.17.0", "pypdf==6.1.1", "trafilatura==2.0.0",
  "python-multipart==0.0.20", "anyio==4.11.0",
]

[project.optional-dependencies]
models = ["sentence-transformers==5.1.1", "transformers==4.57.1", "torch==2.9.0"]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.2"]

[project.scripts]
alfa-assistant = "alfa_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires real Qdrant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
