[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "alfa-ocr"
version = "0.1.0"
description = "Standalone CPU OCR to evidence-grounded structured JSON"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.120.0", "uvicorn==0.38.0", "pydantic-settings==2.11.0",
  "pydantic==2.12.3", "python-multipart==0.0.20", "httpx==0.28.1",
  "jsonschema==4.25.1", "PyMuPDF==1.26.5", "Pillow==11.3.0",
  "numpy==2.2.6", "pytesseract==0.3.13",
  "paddleocr==3.3.0", "paddlepaddle==3.2.2", "paddlex==3.3.10",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
