name: alfa-ocr
services:
  ocr:
    image: alfa-ocr:0.1.0
    build: .
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PROMPT_PATH: /app/prompts/extract.txt
      SCHEMA_PATH: /app/schemas/extraction.schema.json
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ocr-data:/app/data
      - ./prompts:/app/prompts:ro
      - ./schemas:/app/schemas:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
volumes:
  ocr-data: {}
